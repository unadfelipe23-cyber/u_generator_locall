name: Generar package-lock
on: workflow_dispatch

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generar lock
        working-directory: ./u_generator_spck
        run: npm install --package-lock-only

      - name: Subirlo al repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add u_generator_spck/package-lock.json
          git commit -m "generar package-lock.json para cache" || echo "nada que hacer"
          git push
