name: Generate and verify documents

on:
  push:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build, run and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run document generator
        run: node index.js

      - name: Verify generated documents
        run: |
          set -euo pipefail
          # Buscar recursivamente tipos de documentos comunes; excluir node_modules, .git y .github
          DOCS=$(find . -type f \( -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.pdf' -o -iname '*.pptx' \) \
            -not -path './node_modules/*' -not -path './.git/*' -not -path './.github/*' -print)

          if [ -z "$DOCS" ]; then
            echo "ERROR: No documents generated in the repository" >&2
            exit 1
          fi

          echo "✓ Generated documents:"
          echo "$DOCS"

      - name: Upload generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: |
            **/*.docx
            **/*.xlsx
            **/*.pdf
            **/*.pptx
          if-no-files-found: warn
