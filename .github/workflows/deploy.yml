name: Generate and verify documents

on:
  push:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build, run and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run document generator
        run: node index.js

      - name: Verify generated documents
        run: |
          set -euo pipefail
          DOCS=$(find . -maxdepth 1 -type f \( -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.pdf' -o -iname '*.pptx' \))
          
          if [ -z "$DOCS" ]; then
            echo "ERROR: No documents generated in root directory" >&2
            exit 1
          fi
          
          echo "✓ Generated documents:"
          echo "$DOCS"

      - name: Upload generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: |
            *.docx
            *.xlsx
            *.pdf
            *.pptx
          if-no-files-found: warn
